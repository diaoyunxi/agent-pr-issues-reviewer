# Cloudflare Workers 配置（放在仓库根目录，Cloudflare Git 集成可直接识别并自动部署）
name = 'agent-pr-issues-reviewer'
main = "worker/src/index.ts"
compatibility_date = "2024-11-01"

# 密钥（敏感值，加密存储）有以下两种写入方式，效果等价、二选一即可，都不要写在本文件里：
#   1) CLI：每个密钥跑一次 `npx wrangler secret put GITHUB_PAT`（也可用 `wrangler secret bulk secrets.json` 批量）
#   2) Cloudflare 控制台：Workers & Pages → 你的 Worker → Settings → Variables and Secrets，
#      在 Secrets 区直接新增（与 `wrangler secret put` 等价，均为加密存储，运行时以环境变量注入）
# 密钥清单：
#   GITHUB_PAT / GITEE_PAT / GITHUB_WEBHOOK_SECRET / GITEE_WEBHOOK_SECRET
#   GH_APP_ID / GH_APP_INSTALLATION_ID / GH_APP_PRIVATE_KEY / GITEE_APP_TOKEN（App 身份，可选）
# Worker 写本仓库（你 fork 的仓库）的 tasks/ 时优先用 GitHub App 安装令牌，拿不到才回退 GITHUB_PAT。

[vars]
# CONTROL_REPO = 你 fork 后的仓库 owner/repo，Worker 把任务 JSON 推到这里，再由本仓库的 Actions 拉起 Agent。
# 默认即本仓库名；如果你改过 fork 名，按实际填。
CONTROL_REPO = "diaoyunxi/agent-pr-issues-reviewer"

# 非敏感的明文变量写在这里（会打进部署包，不要放令牌）：如 GITHUB_API / GITEE_API（自托管实例时用）。
